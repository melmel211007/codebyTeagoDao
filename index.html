<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game</title>

    <style>
       /* ================================
   CANVA STYLE - SECTION 2
   Cream / Blue / Geometric
================================ */

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Inter', Arial, sans-serif;
    background: #FAF4EA;
    color: #0757B8;
    overflow-x: hidden;
    position: relative;
}

/* =================================
   KHUNG TRANG
================================= */

body::before {
    content: "";
    position: fixed;
    inset: 6px;
    border: 3px solid #7738E8;
    pointer-events: none;
    z-index: 100;
}

/* =================================
   HÌNH TRANG TRÍ
================================= */

/* Các vòng tròn lớn */

body::after {
    content: "";
    position: fixed;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background:
        radial-gradient(circle at center,
            #7895B0 0 68%,
            transparent 69%);
    top: -45px;
    left: -45px;
    opacity: .95;
    z-index: -1;
}

/* =================================
   CONTAINER
================================= */

.quiz-container {
    width: min(1100px, 92%);
    min-height: 650px;
    margin: 40px auto;
    padding: 45px 55px;

    background: #FAF4EA;

    position: relative;
    overflow: hidden;
}

/* Các hình học trang trí */

.quiz-container::before {
    content: "";
    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    background:
        radial-gradient(circle,
            #7895B0 0 4px,
            transparent 5px);

    background-size: 20px 20px;

    top: -45px;
    right: -35px;

    opacity: .75;
    z-index: 0;
}

.quiz-container::after {
    content: "";
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    border: 3px solid #AFC5D8;
    box-shadow:
        20px 20px 0 -3px #FAF4EA,
        20px 20px 0 0 #AFC5D8;

    bottom: -65px;
    left: -45px;

    opacity: .8;
    z-index: 0;
}

/* =================================
   START SCREEN
================================= */

#start-screen {
    min-height: 560px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
    z-index: 2;
}

#start-screen h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(80px, 12vw, 145px);
    font-weight: 500;
    letter-spacing: 3px;
    line-height: .9;

    color: #0757B8;

    margin-bottom: 25px;
}

#start-screen p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    color: #0757B8;
    margin: 5px 0;
}

/* =================================
   BUTTON
================================= */

.start-btn,
.restart-btn,
.next-btn {
    font-family: 'Inter', sans-serif;

    border: none;
    cursor: pointer;

    background: #0757B8;
    color: #FAF4EA;

    font-weight: 700;
    letter-spacing: 1px;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.start-btn {
    margin-top: 30px;

    padding: 17px 48px;

    font-size: 17px;

    border-radius: 4px;

    box-shadow: 6px 6px 0 #7895B0;
}

.start-btn:hover,
.restart-btn:hover,
.next-btn:hover {
    background: #06458F;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 #7895B0;
}

.start-btn:active,
.restart-btn:active,
.next-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 2px 2px 0 #7895B0;
}

/* =================================
   QUIZ SCREEN
================================= */

#quiz-screen {
    position: relative;
    z-index: 2;

    display: none;
}

/* =================================
   TOP BAR
================================= */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;

    color: #0757B8;
}

.question-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 27px;
    font-weight: 600;

    letter-spacing: .5px;
}

.timer {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 17px;
    font-weight: 700;

    color: #0757B8;

    padding: 9px 17px;

    border: 2px solid #0757B8;
    border-radius: 4px;

    background: #FAF4EA;

    transition: .2s ease;
}

.timer.warning {
    color: #ffffff;
    background: #7895B0;
    border-color: #7895B0;

    animation: timerPulse .8s infinite alternate;
}

@keyframes timerPulse {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
    }
}

/* =================================
   PROGRESS
================================= */

.progress-container {
    width: 100%;
    height: 9px;

    background: #D9E1E8;

    border-radius: 0;

    overflow: hidden;

    margin-bottom: 35px;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #0757B8;

    transition: width .3s ease;
}

/* =================================
   QUESTION
================================= */

.question {
    font-family: 'Barlow Condensed', sans-serif;

    font-size: clamp(32px, 4vw, 48px);

    font-weight: 600;

    line-height: 1.15;

    text-align: center;

    color: #0757B8;

    margin: 35px auto 35px;

    max-width: 900px;
}

/* =================================
   QUESTION IMAGE
================================= */

.question-image {
    display: block;

    max-width: 260px;
    max-height: 180px;

    margin: 0 auto 25px;

    object-fit: contain;

    border-radius: 4px;
}

/* =================================
   ANSWERS
================================= */

.answers {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;

    max-width: 900px;

    margin: 0 auto;
}

.answer {
    min-height: 78px;

    display: flex;
    align-items: center;

    background: #FFFFFF;

    border: 2px solid #AFC5D8;

    border-radius: 4px;

    color: #0757B8;

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;

    padding: 14px 18px;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}

.answer:hover {
    border-color: #0757B8;

    background: #F1F6FA;

    transform: translateY(-3px);

    box-shadow: 4px 4px 0 #AFC5D8;
}

.answer-letter {
    width: 40px;
    height: 40px;

    min-width: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 15px;

    background: #7895B0;

    color: #FFFFFF;

    font-family: 'Barlow Condensed', sans-serif;

    font-size: 22px;
    font-weight: 600;

    border-radius: 50%;
}

/* =================================
   ANSWER - CORRECT
================================= */

.answer.correct {
    background: #DCE8F1;

    border-color: #0757B8;

    color: #0757B8;

    box-shadow: 5px 5px 0 #7895B0;
}

.answer.correct .answer-letter {
    background: #0757B8;
}

/* =================================
   ANSWER - WRONG
================================= */

.answer.wrong {
    background: #E7EDF1;

    border-color: #7895B0;

    color: #526D84;
}

.answer.wrong .answer-letter {
    background: #526D84;
}

/* =================================
   FEEDBACK
================================= */

.feedback {
    min-height: 35px;

    margin: 20px auto 10px;

    text-align: center;

    font-family: 'Barlow Condensed', sans-serif;

    font-size: 25px;

    font-weight: 600;

    color: #0757B8;
}

.feedback.correct {
    color: #0757B8;
}

.feedback.wrong {
    color: #7895B0;
}

/* =================================
   BOTTOM AREA
================================= */

.bottom-area {
    display: flex;
    justify-content: flex-end;

    margin-top: 15px;
}

.next-btn {
    display: none;

    padding: 13px 27px;

    font-size: 15px;

    border-radius: 4px;
}

/* =================================
   RESULT SCREEN
================================= */

#result-screen {
    display: none;

    min-height: 560px;

    text-align: center;

    position: relative;
    z-index: 2;

    padding-top: 50px;
}

#result-screen h1 {
    font-family: 'Barlow Condensed', sans-serif;

    font-size: clamp(55px, 8vw, 90px);

    font-weight: 500;

    color: #0757B8;

    margin-bottom: 15px;
}

#result-screen > p {
    font-family: 'Barlow Condensed', sans-serif;

    font-size: 28px;

    color: #0757B8;
}

/* =================================
   SCORE CIRCLE
================================= */

.score-circle {
    width: 190px;
    height: 190px;

    margin: 35px auto;

    border-radius: 50%;

    background: #7895B0;

    color: #FFFFFF;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    border: 8px solid #AFC5D8;

    box-shadow:
        0 0 0 4px #FAF4EA,
        0 0 0 7px #0757B8;
}

.score-number {
    font-family: 'Barlow Condensed', sans-serif;

    font-size: 48px;

    font-weight: 600;

    line-height: 1;
}

.score-text {
    font-size: 15px;

    margin-top: 5px;

    text-transform: uppercase;

    letter-spacing: 2px;
}

.result-message {
    margin: 20px 0;

    color: #0757B8 !important;

    font-family: 'Inter', sans-serif !important;

    font-size: 18px !important;
}

.restart-btn {
    padding: 15px 35px;

    font-size: 15px;

    border-radius: 4px;
}

/* =================================
   DECORATIVE CIRCLES
================================= */

#start-screen::before {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border: 3px solid #AFC5D8;

    border-radius: 50%;

    left: 2%;
    top: 8%;

    opacity: .8;
}

#start-screen::after {
    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #7895B0;

    right: 3%;
    bottom: 5%;

    opacity: .65;
}

/* =================================
   MOBILE
================================= */

@media (max-width: 768px) {

    body::before {
        inset: 3px;
        border-width: 2px;
    }

    .quiz-container {
        width: 94%;

        min-height: calc(100vh - 30px);

        margin: 15px auto;

        padding: 30px 20px;
    }

    #start-screen {
        min-height: 75vh;
    }

    #start-screen h1 {
        font-size: 75px;
        letter-spacing: 1px;
    }

    #start-screen p {
        font-size: 23px;
    }

    .start-btn {
        padding: 15px 35px;
    }

    .top-bar {
        margin-bottom: 12px;
    }

    .question-number {
        font-size: 22px;
    }

    .timer {
        font-size: 14px;
        padding: 7px 11px;
    }

    .progress-container {
        margin-bottom: 25px;
    }

    .question {
        font-size: 31px;

        margin: 25px auto;
    }

    .answers {
        grid-template-columns: 1fr;

        gap: 12px;
    }

    .answer {
        min-height: 65px;

        font-size: 15px;

        padding: 10px 13px;
    }

    .answer-letter {
        width: 34px;
        height: 34px;
        min-width: 34px;

        font-size: 19px;

        margin-right: 12px;
    }

    .feedback {
        font-size: 22px;
    }

    .bottom-area {
        justify-content: center;
    }

    .next-btn {
        width: 100%;

        padding: 14px;
    }

    #result-screen {
        min-height: 75vh;

        padding-top: 30px;
    }

    #result-screen h1 {
        font-size: 58px;
    }

    #result-screen > p {
        font-size: 22px;
    }

    .score-circle {
        width: 160px;
        height: 160px;
    }

    .score-number {
        font-size: 42px;
    }
}

/* =================================
   SMALL MOBILE
================================= */

@media (max-width: 430px) {

    .quiz-container {
        padding: 25px 15px;
    }

    #start-screen h1 {
        font-size: 60px;
    }

    #start-screen p {
        font-size: 20px;
    }

    .question {
        font-size: 27px;
    }

    .answer {
        font-size: 14px;
    }
}
    </style>
</head>

<body>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="quiz-container">



        <div id="start-screen">

            <h1>NEW WORDS GAME</h1>

            <p>
                Mỗi câu có 15 giây hãy chú ý thời gian!!
            </p>

            <br>

            <button class="start-btn" onclick="startQuiz()">
                BẮT ĐẦU
            </button>

        </div>

        <div id="quiz-screen">

            <div class="top-bar">

                <div class="question-number">
                    Câu <span id="current-question">1</span>/<span id="total-question">10</span>
                </div>

                <div class="timer" id="timer">
                    ⏱ <span id="time">15</span>
                </div>

            </div>


            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>


            <img id="question-image" class="question-image" alt="Question image">


            <div class="question" id="question">
            </div>


            <div class="answers" id="answers">
            </div>


            <div class="feedback" id="feedback">
            </div>


            <div class="bottom-area">

                <button class="next-btn" id="next-btn" onclick="nextQuestion()">

                    NEXT →

                </button>

            </div>

        </div>



        <div id="result-screen">

            <h1> HOÀN THÀNH!</h1>

            <p>Bạn đã học xong từ mới của hôm nay !!!</p>


            <div class="score-circle">

                <div class="score-number" id="final-score">
                    0
                </div>

                <div class="score-text">
                    điểm
                </div>

            </div>


            <p class="result-message" id="result-message">
            </p>


            <button class="restart-btn" onclick="restartQuiz()">

                CHƠI LẠI

            </button>



        </div>
    </div>


    <script>


        const TIME_PER_QUESTION = 15;

        let currentQuestion = 0;

        let score = 0;

        let timeLeft = TIME_PER_QUESTION;

        let timerInterval;

        let answered = false;


        const questions = [
            {
                question: "What does 'humpback whale' mean?",
                answers: [
                    "Cá voi sát thủ",
                    "Cá voi lưng gù",
                    "Cá nhà táng",
                    "Cá voi xanh"
                ],
                correct: 1
            },

            {
                question: "What does 'lighthearted' mean?",
                answers: [
                    "Vui vẻ, vô tư",
                    "Buồn bã",
                    "Hoảng sợ",
                    "Phức tạp"
                ],
                correct: 0
            },

            {
                question: "What is a 'whale watcher'?",
                answers: [
                    "Nhà sinh vật học biển",
                    "Người săn cá voi",
                    "Người quan sát cá voi",
                    "Nhà nghiên cứu cá"
                ],
                correct: 2
            },

            {
                question: "What does 'breach' mean when talking about a whale?",
                answers: [
                    "Lặn xuống nước",
                    "Trồi hoặc nhảy vọt lên khỏi mặt nước",
                    "Bơi theo đàn",
                    "Phát ra âm thanh"
                ],
                correct: 1
            },

            {
                question: "What does 'leap' mean?",
                answers: [
                    "Nhảy, bật lên",
                    "Lặn sâu",
                    "Thu hút",
                    "Kéo dài"
                ],
                correct: 0
            },

            {
                question: "What does 'splash' refer to?",
                answers: [
                    "Một đàn cá",
                    "Tiếng hoặc sự bắn tung tóe của nước",
                    "Một cú lặn",
                    "Tiếng hát"
                ],
                correct: 1
            },

            {
                question: "What is a 'school of fish'?",
                answers: [
                    "Một nhóm nhà nghiên cứu",
                    "Một mùa sinh sản",
                    "Một loài cá lớn",
                    "Một đàn cá"
                ],
                correct: 3
            },

            {
                question: "What is a 'marine biologist'?",
                answers: [
                    "Nhà nghiên cứu động vật trên cạn",
                    "Người quan sát cá voi",
                    "Nhà sinh vật học biển",
                    "Ngư dân"
                ],
                correct: 2
            },

            {
                question: "What does 'dive' mean?",
                answers: [
                    "Lặn / cú lặn",
                    "Nhảy lên",
                    "Duỗi ra",
                    "Cạnh tranh"
                ],
                correct: 0
            },

            {
                question: "What does 'curiously' mean?",
                answers: [
                    "Một cách nhanh chóng",
                    "Một cách tò mò",
                    "Một cách hoảng sợ",
                    "Một cách vui vẻ"
                ],
                correct: 1
            },

            {
                question: "What does 'alarmed' mean?",
                answers: [
                    "Vui vẻ",
                    "Tò mò",
                    "Hoảng sợ, lo lắng",
                    "Bình tĩnh"
                ],
                correct: 2
            },

            {
                question: "What does 'aware of' mean?",
                answers: [
                    "Quên mất",
                    "Nhận thức / biết về",
                    "Thu hút",
                    "Tương tác"
                ],
                correct: 1
            },

            {
                question: "What does 'presence' mean?",
                answers: [
                    "Sự cạnh tranh",
                    "Sự thôi thúc",
                    "Sự chuyển động",
                    "Sự hiện diện",
                ],
                correct: 3
            },

            {
                question: "What does 'extend' mean?",
                answers: [
                    "Kéo dài",
                    "Duỗi ra, mở rộng",
                    "Nhảy lên",
                    "Lặn xuống"
                ],
                correct: 1
            },

            {
                question: "What is a 'flipper'?",
                answers: [
                    "Gạc",
                    "Ngà",
                    "Vây chèo",
                    "Đuôi cá"
                ],
                correct: 2
            },

            {
                question: "What does 'complex' mean?",
                answers: [
                    "Đơn giản",
                    "Vui vẻ",
                    "Phức tạp",
                    "Nguy hiểm"
                ],
                correct: 2
            },

            {
                question: "What does 'last' mean as a verb?",
                answers: [
                    "Kéo dài",
                    "Thu hút",
                    "Cạnh tranh",
                    "Tương tác"
                ],
                correct: 0
            },

            {
                question: "What does 'attract' mean?",
                answers: [
                    "Tránh xa",
                    "Thu hút",
                    "Hoảng sợ",
                    "Mở rộng"
                ],
                correct: 1
            },

            {
                question: "What does 'compete' mean?",
                answers: [
                    "Tương tác",
                    "Quan sát",
                    "Cạnh tranh",
                    "Kéo dài"
                ],
                correct: 2
            },

            {
                question: "What are 'antlers'?",
                answers: [
                    "Ngà",
                    "Gạc",
                    "Vây chèo",
                    "Móng vuốt"
                ],
                correct: 1
            },

            {
                question: "What is a 'tusk'?",
                answers: [
                    "Gạc",
                    "Vây",
                    "Ngà",
                    "Sừng nhỏ"
                ],
                correct: 2
            },

            {
                question: "What is a 'researcher'?",
                answers: [
                    "Nhà nghiên cứu",
                    "Người quan sát",
                    "Người săn bắt",
                    "Nhà sinh vật học biển"
                ],
                correct: 0
            },

            {
                question: "What does 'anthem' mean?",
                answers: [
                    "Bài ca, quốc ca",
                    "Mùa sinh sản",
                    "Tiếng động",
                    "Sự hiện diện"
                ],
                correct: 0
            },

            {
                question: "What is a 'breeding season'?",
                answers: [
                    "Mùa di cư",
                    "Mùa săn bắt",
                    "Mùa sinh sản",
                    "Mùa đánh bắt cá"
                ],
                correct: 2
            },

            {
                question: "What does 'interact' mean?",
                answers: [
                    "Tương tác",
                    "Cạnh tranh",
                    "Thu hút",
                    "Duỗi ra"
                ],
                correct: 0
            },

            {
                question: "What does 'urge' mean as a noun?",
                answers: [
                    "Sự hiện diện",
                    "Sự hoảng sợ",
                    "Sự tò mò",
                    "Sự thôi thúc, nhu cầu mạnh mẽ",
                ],
                correct: 3
            }
        ];



        function startQuiz() {
            const music = document.getElementById("bgMusic");

            music.volume = 0.5;
            music.play();

            currentQuestion = 0;
            score = 0;

            document.getElementById("start-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;

            showQuestion();

            currentQuestion = 0;

            score = 0;

            document.getElementById("start-screen").style.display = "none";

            document.getElementById("result-screen").style.display = "none";

            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;


            showQuestion();
        }



        function showQuestion() {

            clearInterval(timerInterval);

            answered = false;

            const questionData = questions[currentQuestion];

            document.getElementById("current-question").textContent =
                currentQuestion + 1;

            document.getElementById("question").textContent =
                questionData.question;


            const progress =
                ((currentQuestion) / questions.length) * 100;

            document.getElementById("progress-bar").style.width =
                progress + "%";


            document.getElementById("feedback").textContent = "";

            document.getElementById("feedback").className =
                "feedback";




            document.getElementById("next-btn").style.display =
                "none";



            const answersContainer =
                document.getElementById("answers");

            answersContainer.innerHTML = "";


            const letters = ["A", "B", "C", "D"];


            questionData.answers.forEach((answer, index) => {

                const answerButton =
                    document.createElement("div");

                answerButton.className = "answer";

                answerButton.innerHTML = `

                <div class="answer-letter">
                    ${letters[index]}
                </div>

                <div>
                    ${answer}
                </div>

            `;

                answerButton.onclick = function () {

                    selectAnswer(index, answerButton);

                };

                answersContainer.appendChild(answerButton);

            });




            startTimer();

        }



        function selectAnswer(index, selectedButton) {

            if (answered) return;

            answered = true;

            clearInterval(timerInterval);


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            if (index === questionData.correct) {

                selectedButton.classList.add("correct");

                score++;

                document.getElementById("feedback").textContent =
                    " Chính xác!";

                document.getElementById("feedback").classList.add(
                    "correct"
                );

            }


            else {

                selectedButton.classList.add("wrong");

                allAnswers[questionData.correct]
                    .classList.add("correct");

                document.getElementById("feedback").textContent =
                    " Sai rồi!";

                document.getElementById("feedback").classList.add(
                    "wrong"
                );

            }


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("next-btn").style.display =
                "block";

        }



        function startTimer() {

            timeLeft = TIME_PER_QUESTION;

            const timeElement =
                document.getElementById("time");

            const timerElement =
                document.getElementById("timer");


            timeElement.textContent = timeLeft;

            timerElement.classList.remove("warning");


            timerInterval = setInterval(() => {

                timeLeft--;

                timeElement.textContent = timeLeft;


                if (timeLeft <= 5) {

                    timerElement.classList.add("warning");

                }


                if (timeLeft <= 0) {

                    clearInterval(timerInterval);

                    timeOut();

                }

            }, 1000);

        }


        function timeOut() {

            if (answered) return;

            answered = true;


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            allAnswers[questionData.correct]
                .classList.add("correct");


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("feedback").textContent =
                "Hết giờ!";

            document.getElementById("feedback").classList.add(
                "wrong"
            );


            document.getElementById("next-btn").style.display =
                "block";

        }


        function nextQuestion() {

            currentQuestion++;


            if (currentQuestion >= questions.length) {

                showResult();

            }

            else {

                showQuestion();

            }

        }

        function showResult() {

            clearInterval(timerInterval);
            const music = document.getElementById("bgMusic");
            music.pause();
            music.currentTime = 0;


            document.getElementById("quiz-screen").style.display =
                "none";

            document.getElementById("result-screen").style.display =
                "block";


            const finalScore =
                document.getElementById("final-score");


            finalScore.textContent =
                score + "/" + questions.length;


            const percentage =
                (score / questions.length) * 100;


            let message;


            if (percentage === 100) {

                message = "Đúng hết òiiii!";

            }

            else if (percentage >= 80) {

                message = "Rất tốt!!!";

            }

            else if (percentage >= 50) {

                message = "Lêu lêu trung bình";

            }

            else {

                message = "Gàaa";

            }


            document.getElementById("result-message")
                .textContent = message;

        }


        function restartQuiz() {

            document.getElementById("result-screen").style.display =
                "none";

            document.getElementById("start-screen").style.display =
                "block";

        }

    </script>

</body>
