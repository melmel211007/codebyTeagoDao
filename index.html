<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Arial Rounded MT Bold", "Nunito", Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(circle at 10% 20%, #5e7b97 0 80px, transparent 81px),
                radial-gradient(circle at 90% 15%, #acbcc9 0 100px, transparent 101px),
                radial-gradient(circle at 80% 90%, #5e7b97 0 120px, transparent 121px),
                linear-gradient(135deg, #fdf6ec);

            color: #4d4352;
        }



        .quiz-container {
            width: 100%;
            max-width: 850px;

            background: rgba(255, 255, 255, 0.95);

            border: 4px solid #ffffff;

            border-radius: 32px;

            padding: 32px;

            box-shadow:
                0 15px 0 #97acc0,
                0 25px 50px rgba(116, 82, 120, 0.18);

            position: relative;

            overflow: hidden;
        }




        .quiz-container::before {
            content: "✦";
            position: absolute;

            top: 15px;
            right: 25px;

            font-size: 30px;

            color: #254c70;

            transform: rotate(15deg);
        }

        .quiz-container::after {
            content: "♡";
            position: absolute;

            bottom: 10px;
            left: 25px;

            font-size: 35px;

            color: #254c70;
        }


        #start-screen {
            text-align: center;
            padding: 45px 20px;
        }

        #start-screen h1 {
            font-size: 55px;

            color: #004aad;

            margin-bottom: 15px;

            text-shadow:
                3px 3px 0 #97acc0;
        }

        #start-screen p {
            font-size: 18px;

            color: #817485;

            margin-bottom: 12px;
        }


        .start-btn,
        .next-btn,
        .restart-btn {

            border: none;

            background: linear-gradient(135deg,
                    #004aad,
                    #78909c);

            color: white;

            font-size: 18px;

            font-weight: bold;

            padding: 16px 38px;

            border-radius: 18px;

            cursor: pointer;

            box-shadow:
                0 6px 0 #97acc0,
                0 10px 20px rgba(151, 172, 192, 0.2);

            transition: 0.15s ease;

            font-family: inherit;
        }

        .start-btn:hover,
        .next-btn:hover,
        .restart-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 9px 0 #97acc0,
                0 15px 25px rgba(151, 172, 192, 0.25);
        }

        .start-btn:active,
        .next-btn:active,
        .restart-btn:active {

            transform: translateY(3px);

            box-shadow:
                0 3px 0 #97acc0;
        }



        #quiz-screen {
            display: none;
        }



        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .question-number {

            font-size: 17px;

            font-weight: bold;

            color: #254c70;

            background: #d2e3ed;

            padding: 9px 15px;

            border-radius: 14px;
        }

        .timer {

            min-width: 80px;

            text-align: center;

            background: #d2e3ed;

            color: #254c70;
            font-size: 18px;

            font-weight: bold;

            padding: 10px 15px;

            border-radius: 15px;

            border: 2px solid #254c70;

            transition: 0.2s;
        }


        /* Timer sắp hết */

        .timer.warning {

            background: #ffe2e2;

            color: #f04f65;

            border-color: #ff9aa9;

            animation: heartbeat 0.7s infinite alternate;
        }


        @keyframes heartbeat {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }



        .progress-container {

            width: 100%;

            height: 14px;

            background: #d2e3ed;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 32px;

            padding: 2px;
        }

        .progress-bar {

            height: 100%;

            width: 0%;

            background:
                linear-gradient(90deg,
                    #97acc0,
                    #004aad);

            border-radius: 20px;

            transition: width 0.4s ease;
        }



        .question {

            font-size: 30px;

            line-height: 1.35;

            text-align: center;

            margin-bottom: 30px;

            color: #514554;

            font-weight: bold;
        }



        .answers {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 16px;
        }


        /* Answer base */

        .answer {

            min-height: 78px;

            border: 3px solid transparent;

            border-radius: 20px;

            background: #faf7fb;

            cursor: pointer;

            display: flex;

            align-items: center;

            padding: 15px 20px;

            font-size: 18px;

            font-weight: bold;

            color: #554958;

            transition:
                transform 0.15s,
                box-shadow 0.15s,
                background 0.15s;

            box-shadow:
                0 5px 0 #97acc0;

            position: relative;

            overflow: hidden;
        }



        .answer:hover {

            transform: translateY(-4px);

            box-shadow:
                0 9px 0 #97acc0;
        }


        .answer:nth-child(1) {

            background: #eaf9fa;

            border-color: #a9dde7;
        }

        .answer:nth-child(1) .answer-letter {

            background: #57abc9;

            color: white;
        }




        .answer:nth-child(2) {

            background: #eaf9fa;

            border-color: #a9dde7;
        }

        .answer:nth-child(2) .answer-letter {

            background: #57abc9;

            color: white;
        }




        .answer:nth-child(3) {

            background: #eaf9fa;

            border-color: #a9dde7;
        }

        .answer:nth-child(3) .answer-letter {

            background: #57abc9;

            color: white;
        }



        .answer:nth-child(4) {

            background: #eaf9fa;

            border-color: #a9dde7;
        }

        .answer:nth-child(4) .answer-letter {

            background: #57abc9;

            color: white;
        }


        .answer-letter {

            width: 43px;

            height: 43px;

            min-width: 43px;

            border-radius: 14px;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-right: 15px;

            font-weight: bold;

            font-size: 17px;

            box-shadow:
                0 3px 0 #b7cde2;
        }


        /* =================================
   CORRECT
================================= */

        .answer.correct {

            background: #dff8e8 !important;

            border-color: #54c98a !important;

            color: #248452 !important;

            animation: correctAnswer 0.4s ease;
        }

        .answer.correct .answer-letter {

            background: #40bd78 !important;

            color: white;
        }


        @keyframes correctAnswer {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =================================
   WRONG
================================= */

        .answer.wrong {

            background: #ffe4e8 !important;

            border-color: #ff7184 !important;

            color: #c53f52 !important;

            animation: wrongAnswer 0.35s ease;
        }

        .answer.wrong .answer-letter {

            background: #ef6174 !important;

            color: white;
        }


        @keyframes wrongAnswer {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }
        }


        /* =================================
   FEEDBACK
================================= */

        .feedback {

            text-align: center;

            font-size: 20px;

            font-weight: bold;

            margin-top: 18px;

            min-height: 28px;
        }

        .feedback.correct {

            color: #32a86b;
        }

        .feedback.wrong {

            color: #ed5b70;
        }


        /* =================================
   NEXT BUTTON
================================= */

        .bottom-area {

            display: flex;

            justify-content: flex-end;

            margin-top: 22px;
        }

        .next-btn {

            display: none;

            padding: 13px 25px;

            font-size: 16px;
        }


        /* =================================
   RESULT SCREEN
================================= */

        #result-screen {

            display: none;

            text-align: center;

            padding: 40px 20px;
        }

        #result-screen h1 {

            color: #004aad;

            font-size: 38px;

            margin-bottom: 15px;

            text-shadow:
                2px 2px 0 #97acc0;
        }

        #result-screen>p {

            color: #817485;

            font-size: 17px;
        }


        /* =================================
   SCORE
================================= */

        .score-circle {

            width: 190px;

            height: 190px;

            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #97acc0,
                    rgba(151, 172, 192, 0.25));

            border: 8px solid white;

            margin: 25px auto;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            box-shadow:
                0 8px 0 #97acc0,
                0 15px 30px rgba(151, 172, 192, 0.12);
        }

        .score-number {

            font-size: 45px;

            font-weight: bold;

            color: #254c70;
        }

        .score-text {

            color: #8c99a0;

            font-size: 15px;
        }

        .result-message {

            font-size: 20px;

            margin-bottom: 25px;

            color: #645668 !important;
        }


        /* =================================
   MOBILE
================================= */

        @media (max-width: 650px) {

            body {
                padding: 10px;
            }

            .quiz-container {

                padding: 20px;

                border-radius: 25px;

                box-shadow:
                    0 10px 0 #97acc0,
                    0 18px 35px rgba(151, 172, 192, 0.15);
            }


            #start-screen {

                padding: 35px 10px;
            }


            #start-screen h1 {

                font-size: 40px;
            }


            .question {

                font-size: 23px;

                margin-bottom: 22px;
            }


            .answers {

                grid-template-columns: 1fr;

                gap: 12px;
            }


            .answer {

                min-height: 68px;

                font-size: 16px;

                border-radius: 17px;
            }


            .answer-letter {

                width: 40px;

                height: 40px;

                min-width: 40px;

                border-radius: 12px;
            }


            .top-bar {

                margin-bottom: 14px;
            }


            .question-number {

                font-size: 13px;

                padding: 8px 11px;
            }


            .timer {

                font-size: 15px;

                min-width: 70px;

                padding: 8px 10px;
            }


            .progress-container {

                height: 11px;

                margin-bottom: 25px;
            }


            .bottom-area {

                justify-content: center;
            }


            .next-btn {

                width: 100%;
            }


            .score-circle {

                width: 160px;

                height: 160px;
            }
        }
    </style>
</head>

<body>
    <audio id="bgMusic" loop>
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <div class="quiz-container">



        <div id="start-screen">

            <h1>NEW WORDS GAME</h1>

            <p>
                Mỗi câu có 15 giây hãy chú ý thời gian!!
            </p>

            <br>

            <button class="start-btn" onclick="startQuiz()">
                BẮT ĐẦU
            </button>

        </div>

        <div id="quiz-screen">

            <div class="top-bar">

                <div class="question-number">
                    Câu <span id="current-question">1</span>/<span id="total-question">10</span>
                </div>

                <div class="timer" id="timer">
                    ⏱ <span id="time">15</span>
                </div>

            </div>


            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>


            <div class="question" id="question">
            </div>


            <div class="answers" id="answers">
            </div>


            <div class="feedback" id="feedback">
            </div>


            <div class="bottom-area">

                <button class="next-btn" id="next-btn" onclick="nextQuestion()">

                    NEXT →

                </button>

            </div>

        </div>



        <div id="result-screen">

            <h1> HOÀN THÀNH!</h1>

            <p>Bạn đã học xong từ mới của hôm nay !!!</p>


            <div class="score-circle">

                <div class="score-number" id="final-score">
                    0
                </div>

                <div class="score-text">
                    điểm
                </div>

            </div>


            <p class="result-message" id="result-message">
            </p>


            <button class="restart-btn" onclick="restartQuiz()">

                CHƠI LẠI

            </button>



        </div>
    </div>


    <script>


        const TIME_PER_QUESTION = 15;

        let currentQuestion = 0;

        let score = 0;

        let timeLeft = TIME_PER_QUESTION;

        let timerInterval;

        let answered = false;


        const questions = [
            {
                question: "What does 'humpback whale' mean?",
                answers: [
                    "Cá voi sát thủ",
                    "Cá voi lưng gù",
                    "Cá nhà táng",
                    "Cá voi xanh"
                ],
                correct: 1
            },

            {
                question: "What does 'lighthearted' mean?",
                answers: [
                    "Vui vẻ, vô tư",
                    "Buồn bã",
                    "Hoảng sợ",
                    "Phức tạp"
                ],
                correct: 0
            },

            {
                question: "What is a 'whale watcher'?",
                answers: [
                    "Nhà sinh vật học biển",
                    "Người săn cá voi",
                    "Người quan sát cá voi",
                    "Nhà nghiên cứu cá"
                ],
                correct: 2
            },

            {
                question: "What does 'breach' mean when talking about a whale?",
                answers: [
                    "Lặn xuống nước",
                    "Trồi hoặc nhảy vọt lên khỏi mặt nước",
                    "Bơi theo đàn",
                    "Phát ra âm thanh"
                ],
                correct: 1
            },

            {
                question: "What does 'leap' mean?",
                answers: [
                    "Nhảy, bật lên",
                    "Lặn sâu",
                    "Thu hút",
                    "Kéo dài"
                ],
                correct: 0
            },

            {
                question: "What does 'splash' refer to?",
                answers: [
                    "Một đàn cá",
                    "Tiếng hoặc sự bắn tung tóe của nước",
                    "Một cú lặn",
                    "Tiếng hát"
                ],
                correct: 1
            },

            {
                question: "What is a 'school of fish'?",
                answers: [
                    "Một nhóm nhà nghiên cứu",
                    "Một mùa sinh sản",
                    "Một loài cá lớn",
                    "Một đàn cá"
                ],
                correct: 3
            },

            {
                question: "What is a 'marine biologist'?",
                answers: [
                    "Nhà nghiên cứu động vật trên cạn",
                    "Người quan sát cá voi",
                    "Nhà sinh vật học biển",
                    "Ngư dân"
                ],
                correct: 2
            },

            {
                question: "What does 'dive' mean?",
                answers: [
                    "Lặn / cú lặn",
                    "Nhảy lên",
                    "Duỗi ra",
                    "Cạnh tranh"
                ],
                correct: 0
            },

            {
                question: "What does 'curiously' mean?",
                answers: [
                    "Một cách nhanh chóng",
                    "Một cách tò mò",
                    "Một cách hoảng sợ",
                    "Một cách vui vẻ"
                ],
                correct: 1
            },

            {
                question: "What does 'alarmed' mean?",
                answers: [
                    "Vui vẻ",
                    "Tò mò",
                    "Hoảng sợ, lo lắng",
                    "Bình tĩnh"
                ],
                correct: 2
            },

            {
                question: "What does 'aware of' mean?",
                answers: [
                    "Quên mất",
                    "Nhận thức / biết về",
                    "Thu hút",
                    "Tương tác"
                ],
                correct: 1
            },

            {
                question: "What does 'presence' mean?",
                answers: [
                    "Sự cạnh tranh",
                    "Sự thôi thúc",
                    "Sự chuyển động",
                    "Sự hiện diện",
                ],
                correct: 3
            },

            {
                question: "What does 'extend' mean?",
                answers: [
                    "Kéo dài",
                    "Duỗi ra, mở rộng",
                    "Nhảy lên",
                    "Lặn xuống"
                ],
                correct: 1
            },

            {
                question: "What is a 'flipper'?",
                answers: [
                    "Gạc",
                    "Ngà",
                    "Vây chèo",
                    "Đuôi cá"
                ],
                correct: 2
            },

            {
                question: "What does 'complex' mean?",
                answers: [
                    "Đơn giản",
                    "Vui vẻ",
                    "Phức tạp",
                    "Nguy hiểm"
                ],
                correct: 2
            },

            {
                question: "What does 'last' mean as a verb?",
                answers: [
                    "Kéo dài",
                    "Thu hút",
                    "Cạnh tranh",
                    "Tương tác"
                ],
                correct: 0
            },

            {
                question: "What does 'attract' mean?",
                answers: [
                    "Tránh xa",
                    "Thu hút",
                    "Hoảng sợ",
                    "Mở rộng"
                ],
                correct: 1
            },

            {
                question: "What does 'compete' mean?",
                answers: [
                    "Tương tác",
                    "Quan sát",
                    "Cạnh tranh",
                    "Kéo dài"
                ],
                correct: 2
            },

            {
                question: "What are 'antlers'?",
                answers: [
                    "Ngà",
                    "Gạc",
                    "Vây chèo",
                    "Móng vuốt"
                ],
                correct: 1
            },

            {
                question: "What is a 'tusk'?",
                answers: [
                    "Gạc",
                    "Vây",
                    "Ngà",
                    "Sừng nhỏ"
                ],
                correct: 2
            },

            {
                question: "What is a 'researcher'?",
                answers: [
                    "Nhà nghiên cứu",
                    "Người quan sát",
                    "Người săn bắt",
                    "Nhà sinh vật học biển"
                ],
                correct: 0
            },

            {
                question: "What does 'anthem' mean?",
                answers: [
                    "Bài ca, quốc ca",
                    "Mùa sinh sản",
                    "Tiếng động",
                    "Sự hiện diện"
                ],
                correct: 0
            },

            {
                question: "What is a 'breeding season'?",
                answers: [
                    "Mùa di cư",
                    "Mùa săn bắt",
                    "Mùa sinh sản",
                    "Mùa đánh bắt cá"
                ],
                correct: 2
            },

            {
                question: "What does 'interact' mean?",
                answers: [
                    "Tương tác",
                    "Cạnh tranh",
                    "Thu hút",
                    "Duỗi ra"
                ],
                correct: 0
            },

            {
                question: "What does 'urge' mean as a noun?",
                answers: [
                    "Sự hiện diện",
                    "Sự hoảng sợ",
                    "Sự tò mò",
                    "Sự thôi thúc, nhu cầu mạnh mẽ",
                ],
                correct: 3
            }
        ];



        function startQuiz() {
            const music = document.getElementById("bgMusic");

            music.volume = 0.5;
            music.play();

            currentQuestion = 0;
            score = 0;

            document.getElementById("start-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;

            showQuestion();

            currentQuestion = 0;

            score = 0;

            document.getElementById("start-screen").style.display = "none";

            document.getElementById("result-screen").style.display = "none";

            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;


            showQuestion();
        }



        function showQuestion() {

            clearInterval(timerInterval);

            answered = false;

            const questionData = questions[currentQuestion];

            document.getElementById("current-question").textContent =
                currentQuestion + 1;

            document.getElementById("question").textContent =
                questionData.question;


            const progress =
                ((currentQuestion) / questions.length) * 100;

            document.getElementById("progress-bar").style.width =
                progress + "%";


            document.getElementById("feedback").textContent = "";

            document.getElementById("feedback").className =
                "feedback";




            document.getElementById("next-btn").style.display =
                "none";



            const answersContainer =
                document.getElementById("answers");

            answersContainer.innerHTML = "";


            const letters = ["A", "B", "C", "D"];


            questionData.answers.forEach((answer, index) => {

                const answerButton =
                    document.createElement("div");

                answerButton.className = "answer";

                answerButton.innerHTML = `

                <div class="answer-letter">
                    ${letters[index]}
                </div>

                <div>
                    ${answer}
                </div>

            `;

                answerButton.onclick = function () {

                    selectAnswer(index, answerButton);

                };

                answersContainer.appendChild(answerButton);

            });




            startTimer();

        }



        function selectAnswer(index, selectedButton) {

            if (answered) return;

            answered = true;

            clearInterval(timerInterval);


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            if (index === questionData.correct) {

                selectedButton.classList.add("correct");

                score++;

                document.getElementById("feedback").textContent =
                    " Chính xác!";

                document.getElementById("feedback").classList.add(
                    "correct"
                );

            }


            else {

                selectedButton.classList.add("wrong");

                allAnswers[questionData.correct]
                    .classList.add("correct");

                document.getElementById("feedback").textContent =
                    " Sai rồi!";

                document.getElementById("feedback").classList.add(
                    "wrong"
                );

            }


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("next-btn").style.display =
                "block";

        }



        function startTimer() {

            timeLeft = TIME_PER_QUESTION;

            const timeElement =
                document.getElementById("time");

            const timerElement =
                document.getElementById("timer");


            timeElement.textContent = timeLeft;

            timerElement.classList.remove("warning");


            timerInterval = setInterval(() => {

                timeLeft--;

                timeElement.textContent = timeLeft;


                if (timeLeft <= 5) {

                    timerElement.classList.add("warning");

                }


                if (timeLeft <= 0) {

                    clearInterval(timerInterval);

                    timeOut();

                }

            }, 1000);

        }


        function timeOut() {

            if (answered) return;

            answered = true;


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            allAnswers[questionData.correct]
                .classList.add("correct");


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("feedback").textContent =
                "Hết giờ!";

            document.getElementById("feedback").classList.add(
                "wrong"
            );


            document.getElementById("next-btn").style.display =
                "block";

        }


        function nextQuestion() {

            currentQuestion++;


            if (currentQuestion >= questions.length) {

                showResult();

            }

            else {

                showQuestion();

            }

        }

        function showResult() {

            clearInterval(timerInterval);
            const music = document.getElementById("bgMusic");
            music.pause();
            music.currentTime = 0;


            document.getElementById("quiz-screen").style.display =
                "none";

            document.getElementById("result-screen").style.display =
                "block";


            const finalScore =
                document.getElementById("final-score");


            finalScore.textContent =
                score + "/" + questions.length;


            const percentage =
                (score / questions.length) * 100;


            let message;


            if (percentage === 100) {

                message = "Đúng hết òiiii!";

            }

            else if (percentage >= 80) {

                message = "Rất tốt!!!";

            }

            else if (percentage >= 50) {

                message = "Lêu lêu trung bình";

            }

            else {

                message = "Gàaa";

            }


            document.getElementById("result-message")
                .textContent = message;

        }


        function restartQuiz() {

            document.getElementById("result-screen").style.display =
                "none";

            document.getElementById("start-screen").style.display =
                "block";

        }

    </script>

</body>

</html>
