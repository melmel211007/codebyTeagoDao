<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game</title>

    <style>
       @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap');

/* =====================================================
   PALETTE
===================================================== */

:root {
    --cream: #F9F3E9;
    --cream-dark: #F1E9DB;

    --blue: #0757B8;
    --blue-dark: #06458E;

    --slate: #7895B0;
    --slate-light: #AFC4D6;
    --slate-pale: #DCE6EE;

    --white: #FFFDF9;

    --purple: #7838E8;

    --text: #183D63;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family: "DM Sans", Arial, sans-serif;

    background:
        radial-gradient(circle at 8% 5%,
            rgba(120,149,176,.22) 0 90px,
            transparent 91px),

        radial-gradient(circle at 94% 91%,
            rgba(120,149,176,.18) 0 130px,
            transparent 131px),

        var(--cream);

    color: var(--text);

    overflow-x: hidden;
}


/* =====================================================
   OUTER CANVA BORDER
===================================================== */

body::before {
    content: "";

    position: fixed;

    inset: 7px;

    border: 3px solid var(--purple);

    pointer-events: none;

    z-index: 999;
}


/* =====================================================
   DECORATIVE BACKGROUND
===================================================== */

/* top-left circle */

body::after {
    content: "";

    position: fixed;

    width: 240px;
    height: 240px;

    left: -95px;
    top: -65px;

    border-radius: 50%;

    background: var(--slate);

    opacity: .9;

    box-shadow:
        150px 40px 0 -85px var(--slate-light),
        115px 125px 0 -75px var(--slate-light);

    pointer-events: none;

    z-index: 0;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.quiz-container {

    width: min(1080px, calc(100% - 50px));

    min-height: 650px;

    margin: 35px auto;

    padding: 35px 55px;

    position: relative;

    overflow: hidden;

    background: rgba(249,243,233,.94);

    border-radius: 18px;

    border: 1px solid rgba(120,149,176,.2);

    box-shadow:
        0 25px 60px rgba(48,74,99,.12),
        0 5px 15px rgba(48,74,99,.08);
}


/* =====================================================
   DECORATIVE DOT PATTERN
===================================================== */

.quiz-container::before {

    content: "";

    position: absolute;

    width: 190px;
    height: 150px;

    right: -30px;
    top: -25px;

    background-image:
        radial-gradient(
            circle,
            rgba(120,149,176,.55) 3px,
            transparent 4px
        );

    background-size: 19px 19px;

    transform: rotate(-7deg);

    opacity: .8;

    pointer-events: none;
}


/* =====================================================
   BOTTOM DECORATION
===================================================== */

.quiz-container::after {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -25px;
    bottom: -40px;

    border-radius: 50%;

    background: var(--slate);

    box-shadow:
        -90px 20px 0 -45px var(--slate-light),
        -120px -15px 0 -48px var(--slate);

    opacity: .8;

    pointer-events: none;
}


/* =====================================================
   START SCREEN
===================================================== */

#start-screen {

    min-height: 575px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    position: relative;

    z-index: 5;
}


/* little label */

#start-screen::before {

    content: "VOCABULARY QUIZ";

    position: absolute;

    top: 25px;

    left: 0;

    padding: 8px 17px;

    background: var(--blue);

    color: white;

    border-radius: 30px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;
}


/* decorative ring */

#start-screen::after {

    content: "";

    position: absolute;

    width: 115px;
    height: 115px;

    left: 5%;
    bottom: 8%;

    border: 2px solid var(--slate-light);

    border-radius: 50%;

    box-shadow:
        18px 18px 0 -4px var(--cream),
        18px 18px 0 -1px var(--slate-light);
}


/* =====================================================
   START TITLE
===================================================== */

#start-screen h1 {

    font-family: "Oswald", sans-serif;

    font-size: clamp(80px, 12vw, 145px);

    font-weight: 500;

    letter-spacing: -3px;

    line-height: .85;

    color: var(--blue);

    position: relative;

    z-index: 2;

    margin-bottom: 28px;

    text-shadow:
        5px 5px 0 rgba(120,149,176,.25);
}


/* underline */

#start-screen h1::after {

    content: "";

    display: block;

    width: 100px;
    height: 5px;

    margin: 22px auto 0;

    background: var(--blue);

    border-radius: 10px;
}


/* subtitle */

#start-screen p {

    font-size: 18px;

    color: #55718C;

    margin: 5px 0;

    font-weight: 500;

    position: relative;

    z-index: 2;
}


/* =====================================================
   START BUTTON
===================================================== */

.start-btn {

    margin-top: 35px;

    padding: 16px 45px;

    border: none;

    border-radius: 50px;

    background: var(--blue);

    color: white;

    font-family: "DM Sans", sans-serif;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1.5px;

    cursor: pointer;

    position: relative;

    z-index: 5;

    box-shadow:
        0 8px 0 var(--slate),
        0 15px 25px rgba(7,87,184,.18);

    transition: all .2s ease;
}

.start-btn:hover {

    transform: translateY(-4px);

    background: var(--blue-dark);

    box-shadow:
        0 12px 0 var(--slate),
        0 18px 30px rgba(7,87,184,.2);
}

.start-btn:active {

    transform: translateY(4px);

    box-shadow:
        0 4px 0 var(--slate),
        0 7px 15px rgba(7,87,184,.15);
}


/* =====================================================
   QUIZ SCREEN
===================================================== */

#quiz-screen {

    display: none;

    position: relative;

    z-index: 5;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 17px;
}


/* question counter */

.question-number {

    display: inline-flex;

    align-items: center;

    padding: 9px 16px;

    background: var(--white);

    border: 1px solid var(--slate-light);

    border-radius: 30px;

    color: var(--blue);

    font-size: 14px;

    font-weight: 700;

    box-shadow: 0 5px 12px rgba(50,80,105,.06);
}


/* =====================================================
   TIMER
===================================================== */

.timer {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 9px 16px;

    border-radius: 30px;

    background: var(--blue);

    color: white;

    font-size: 14px;

    font-weight: 700;

    box-shadow:
        0 5px 12px rgba(7,87,184,.18);

    transition: .2s ease;
}

.timer.warning {

    background: var(--slate);

    animation: timerShake .45s infinite alternate;
}

@keyframes timerShake {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}


/* =====================================================
   PROGRESS BAR
===================================================== */

.progress-container {

    width: 100%;

    height: 8px;

    background: var(--slate-pale);

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 42px;
}

.progress-bar {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            #3C7FC8
        );

    border-radius: 20px;

    transition: width .35s ease;
}


/* =====================================================
   QUESTION
===================================================== */

.question {

    max-width: 850px;

    margin: 0 auto 38px;

    text-align: center;

    font-family: "Oswald", sans-serif;

    font-size: clamp(35px, 4vw, 52px);

    font-weight: 500;

    letter-spacing: -.5px;

    line-height: 1.15;

    color: var(--blue);
}


/* =====================================================
   QUESTION IMAGE
===================================================== */

.question-image {

    display: block;

    max-width: 280px;

    max-height: 180px;

    margin: 0 auto 25px;

    object-fit: contain;

    border-radius: 12px;

    box-shadow:
        0 12px 25px rgba(40,65,90,.12);
}


/* =====================================================
   ANSWERS
===================================================== */

.answers {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;

    max-width: 900px;

    margin: auto;
}


/* answer card */

.answer {

    min-height: 82px;

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 14px 18px;

    background: rgba(255,253,249,.92);

    border: 2px solid #D2DEE7;

    border-radius: 15px;

    color: var(--text);

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(50,80,105,.06);

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}


/* hover */

.answer:hover {

    transform: translateY(-4px);

    border-color: var(--slate);

    background: white;

    box-shadow:
        0 12px 24px rgba(60,90,115,.12);
}


/* =====================================================
   ANSWER LETTER
===================================================== */

.answer-letter {

    width: 43px;
    height: 43px;

    min-width: 43px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: var(--slate-pale);

    color: var(--blue);

    font-family: "Oswald", sans-serif;

    font-size: 21px;

    font-weight: 500;

    border: 2px solid var(--slate-light);

    transition: .2s ease;
}

.answer:hover .answer-letter {

    background: var(--blue);

    color: white;

    border-color: var(--blue);

    transform: rotate(-8deg);
}


/* =====================================================
   CORRECT
===================================================== */

.answer.correct {

    background: #E4EEF5;

    border-color: var(--blue);

    color: var(--blue);

    box-shadow:
        0 8px 20px rgba(7,87,184,.14);
}

.answer.correct .answer-letter {

    background: var(--blue);

    border-color: var(--blue);

    color: white;
}


/* =====================================================
   WRONG
===================================================== */

.answer.wrong {

    background: #E9EEF1;

    border-color: var(--slate);

    color: #657B8D;
}

.answer.wrong .answer-letter {

    background: var(--slate);

    border-color: var(--slate);

    color: white;
}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    min-height: 35px;

    margin: 20px auto 5px;

    text-align: center;

    font-size: 18px;

    font-weight: 700;

    color: var(--blue);
}

.feedback.correct {

    color: var(--blue);
}

.feedback.wrong {

    color: var(--slate);
}


/* =====================================================
   NEXT BUTTON
===================================================== */

.bottom-area {

    display: flex;

    justify-content: flex-end;

    margin-top: 15px;
}

.next-btn {

    display: none;

    padding: 13px 25px;

    border: none;

    border-radius: 50px;

    background: var(--blue);

    color: white;

    font-family: "DM Sans", sans-serif;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: .5px;

    cursor: pointer;

    box-shadow:
        0 6px 0 var(--slate);

    transition: .18s ease;
}

.next-btn:hover {

    transform: translateY(-3px);

    background: var(--blue-dark);

    box-shadow:
        0 9px 0 var(--slate);
}

.next-btn:active {

    transform: translateY(3px);

    box-shadow:
        0 3px 0 var(--slate);
}


/* =====================================================
   RESULT SCREEN
===================================================== */

#result-screen {

    display: none;

    min-height: 575px;

    text-align: center;

    position: relative;

    z-index: 5;

    padding-top: 50px;
}

#result-screen h1 {

    font-family: "Oswald", sans-serif;

    font-size: clamp(60px, 8vw, 100px);

    font-weight: 500;

    line-height: 1;

    color: var(--blue);

    letter-spacing: -2px;
}

#result-screen > p {

    margin-top: 15px;

    color: #55718C;

    font-size: 17px;
}


/* =====================================================
   SCORE
===================================================== */

.score-circle {

    width: 195px;
    height: 195px;

    margin: 38px auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: var(--blue);

    color: white;

    border: 8px solid var(--slate-light);

    box-shadow:
        0 0 0 5px var(--cream),
        0 0 0 8px var(--blue),
        0 18px 35px rgba(7,87,184,.18);
}

.score-number {

    font-family: "Oswald", sans-serif;

    font-size: 52px;

    line-height: 1;

    font-weight: 500;
}

.score-text {

    margin-top: 7px;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 2px;

    opacity: .8;
}

.result-message {

    margin: 20px auto !important;

    max-width: 500px;

    font-size: 17px !important;

    color: var(--text) !important;
}


/* =====================================================
   RESTART
===================================================== */

.restart-btn {

    padding: 15px 38px;

    border: none;

    border-radius: 50px;

    background: var(--blue);

    color: white;

    font-family: "DM Sans", sans-serif;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 7px 0 var(--slate);

    transition: .2s ease;
}

.restart-btn:hover {

    transform: translateY(-3px);

    background: var(--blue-dark);

    box-shadow:
        0 10px 0 var(--slate);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    body::before {
        inset: 3px;
        border-width: 2px;
    }

    .quiz-container {

        width: calc(100% - 25px);

        min-height: calc(100vh - 30px);

        margin: 15px auto;

        padding: 28px 18px;

        border-radius: 14px;
    }

    #start-screen {

        min-height: 75vh;
    }

    #start-screen::before {

        top: 8px;

        font-size: 9px;

        padding: 7px 12px;
    }

    #start-screen h1 {

        font-size: 75px;

        letter-spacing: -2px;
    }

    #start-screen p {

        font-size: 15px;
    }

    .start-btn {

        padding: 15px 35px;

        margin-top: 28px;
    }


    /* top */

    .top-bar {

        margin-bottom: 12px;
    }

    .question-number,
    .timer {

        font-size: 12px;

        padding: 8px 12px;
    }


    /* progress */

    .progress-container {

        height: 7px;

        margin-bottom: 30px;
    }


    /* question */

    .question {

        font-size: 34px;

        margin-bottom: 28px;
    }


    /* answers */

    .answers {

        grid-template-columns: 1fr;

        gap: 12px;
    }

    .answer {

        min-height: 68px;

        padding: 11px 13px;

        border-radius: 12px;

        font-size: 14px;
    }

    .answer-letter {

        width: 37px;
        height: 37px;

        min-width: 37px;

        font-size: 18px;
    }


    /* next */

    .bottom-area {

        justify-content: center;

        margin-top: 15px;
    }

    .next-btn {

        width: 100%;

        padding: 14px;
    }


    /* result */

    #result-screen {

        min-height: 75vh;

        padding-top: 40px;
    }

    #result-screen h1 {

        font-size: 65px;
    }

    .score-circle {

        width: 165px;
        height: 165px;

        margin: 30px auto;
    }

    .score-number {

        font-size: 45px;
    }
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 430px) {

    .quiz-container {

        padding: 25px 14px;
    }

    #start-screen h1 {

        font-size: 62px;
    }

    .question {

        font-size: 29px;
    }

    .answer {

        font-size: 13.5px;
    }

    .question-number {

        font-size: 11px;
    }

    .timer {

        font-size: 11px;
    }
}
    </style>
</head>

        function startQuiz() {
            const music = document.getElementById("bgMusic");

            music.volume = 0.5;
            music.play();

            currentQuestion = 0;
            score = 0;

            document.getElementById("start-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;

            showQuestion();

            currentQuestion = 0;

            score = 0;

            document.getElementById("start-screen").style.display = "none";

            document.getElementById("result-screen").style.display = "none";

            document.getElementById("quiz-screen").style.display = "block";

            document.getElementById("total-question").textContent =
                questions.length;


            showQuestion();
        }



        function showQuestion() {

            clearInterval(timerInterval);

            answered = false;

            const questionData = questions[currentQuestion];

            document.getElementById("current-question").textContent =
                currentQuestion + 1;

            document.getElementById("question").textContent =
                questionData.question;


            const progress =
                ((currentQuestion) / questions.length) * 100;

            document.getElementById("progress-bar").style.width =
                progress + "%";


            document.getElementById("feedback").textContent = "";

            document.getElementById("feedback").className =
                "feedback";




            document.getElementById("next-btn").style.display =
                "none";



            const answersContainer =
                document.getElementById("answers");

            answersContainer.innerHTML = "";


            const letters = ["A", "B", "C", "D"];


            questionData.answers.forEach((answer, index) => {

                const answerButton =
                    document.createElement("div");

                answerButton.className = "answer";

                answerButton.innerHTML = `

                <div class="answer-letter">
                    ${letters[index]}
                </div>

                <div>
                    ${answer}
                </div>

            `;

                answerButton.onclick = function () {

                    selectAnswer(index, answerButton);

                };

                answersContainer.appendChild(answerButton);

            });




            startTimer();

        }



        function selectAnswer(index, selectedButton) {

            if (answered) return;

            answered = true;

            clearInterval(timerInterval);


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            if (index === questionData.correct) {

                selectedButton.classList.add("correct");

                score++;

                document.getElementById("feedback").textContent =
                    " Chính xác!";

                document.getElementById("feedback").classList.add(
                    "correct"
                );

            }


            else {

                selectedButton.classList.add("wrong");

                allAnswers[questionData.correct]
                    .classList.add("correct");

                document.getElementById("feedback").textContent =
                    " Sai rồi!";

                document.getElementById("feedback").classList.add(
                    "wrong"
                );

            }


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("next-btn").style.display =
                "block";

        }



        function startTimer() {

            timeLeft = TIME_PER_QUESTION;

            const timeElement =
                document.getElementById("time");

            const timerElement =
                document.getElementById("timer");


            timeElement.textContent = timeLeft;

            timerElement.classList.remove("warning");


            timerInterval = setInterval(() => {

                timeLeft--;

                timeElement.textContent = timeLeft;


                if (timeLeft <= 5) {

                    timerElement.classList.add("warning");

                }


                if (timeLeft <= 0) {

                    clearInterval(timerInterval);

                    timeOut();

                }

            }, 1000);

        }


        function timeOut() {

            if (answered) return;

            answered = true;


            const questionData =
                questions[currentQuestion];


            const allAnswers =
                document.querySelectorAll(".answer");


            allAnswers[questionData.correct]
                .classList.add("correct");


            allAnswers.forEach(answer => {

                answer.style.pointerEvents = "none";

            });


            document.getElementById("feedback").textContent =
                "Hết giờ!";

            document.getElementById("feedback").classList.add(
                "wrong"
            );


            document.getElementById("next-btn").style.display =
                "block";

        }


        function nextQuestion() {

            currentQuestion++;


            if (currentQuestion >= questions.length) {

                showResult();

            }

            else {

                showQuestion();

            }

        }

        function showResult() {

            clearInterval(timerInterval);
            const music = document.getElementById("bgMusic");
            music.pause();
            music.currentTime = 0;


            document.getElementById("quiz-screen").style.display =
                "none";

            document.getElementById("result-screen").style.display =
                "block";


            const finalScore =
                document.getElementById("final-score");


            finalScore.textContent =
                score + "/" + questions.length;


            const percentage =
                (score / questions.length) * 100;


            let message;


            if (percentage === 100) {

                message = "Đúng hết òiiii!";

            }

            else if (percentage >= 80) {

                message = "Rất tốt!!!";

            }

            else if (percentage >= 50) {

                message = "Lêu lêu trung bình";

            }

            else {

                message = "Gàaa";

            }


            document.getElementById("result-message")
                .textContent = message;

        }


        function restartQuiz() {

            document.getElementById("result-screen").style.display =
                "none";

            document.getElementById("start-screen").style.display =
                "block";

        }

    </script>
